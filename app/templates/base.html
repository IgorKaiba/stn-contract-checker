<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Проверка условий договоров поставки</title>
<style>
 body{font:15px/1.45 system-ui,sans-serif;margin:24px auto;max-width:1200px;padding:0 16px;color:#1d1d1f}
 a{color:#0b5cad} h1{font-size:22px;margin:0 0 4px} h2{font-size:17px;margin:28px 0 8px}
 nav a{margin-right:16px} table{border-collapse:collapse;width:100%} th,td{border:1px solid #d6d6d6;padding:8px;vertical-align:top;text-align:left}
 th{background:#f3f4f6} .muted{color:#5f6368;font-size:13px} .quote{font-size:13px;color:#333;border-left:3px solid #c7c7c7;padding-left:6px;margin:4px 0}
 .b{display:inline-block;font-size:12px;padding:1px 6px;border-radius:4px;margin-left:4px;white-space:nowrap}
 .OK{background:#e6f4ea;color:#185c2c}.CHANGED{background:#e3eefc;color:#0b3d91}.NO_DATA{background:#eee;color:#333}.NEEDS_REVIEW{background:#fde8e8;color:#8a1c1c}
 .pending{background:#fff4e0;color:#7a4b00} .val{font-weight:600} form.inline{display:inline}
 .para{white-space:pre-wrap;padding:6px 8px;margin:4px 0;border-radius:4px} .para:target{background:#fff8c5;outline:2px solid #e5c100}
 mark{background:#ffe066} .pid{color:#888;font-size:12px;margin-right:8px}
</style></head><body>
<nav><a href="/">Таблица договоров</a><a href="/ask">Вопросы</a></nav>
{% block body %}{% endblock %}
</body></html>
